<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw — live diagram drafting</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="mark" id="brand-mark" title="Diagram type">SEQ</span>
      <span class="name" id="brand-name">Sequence</span>
      <span class="sub">// live diagram drafting</span>
    </div>

    <div class="toolbar hidden-control" id="snippets"></div>

    <div class="spacer"></div>

    <div class="spacing-control hidden-control">
      <label for="spacing" id="spacing-label">Node spacing</label>
      <input type="range" id="spacing" min="90" max="360" step="10" value="150">
      <span id="spacing-val">150px</span>
    </div>

    <label class="toggle-control" for="toggle2">
      <input type="checkbox" id="toggle2" checked>
      <span id="toggle2-label">Bottom boxes</span>
    </label>

    <div class="action-group">
      <button class="abtn ghost hidden-control" id="btn-sample">Load example</button>
      <button class="abtn ghost hidden-control" id="btn-reset-layout">Reset layout</button>
      <button class="abtn ghost hidden-control" id="btn-clear">Clear</button>
      <button class="abtn ghost hidden-control" id="btn-svg">Download SVG</button>
      <button class="abtn primary" id="btn-png">Download PNG</button>
    </div>
  </div>

  <div class="app-body">
  <aside class="app-rail" id="app-rail" aria-label="Icon rail">
    <button class="rail-icon-btn" id="rail-files-btn" aria-label="My diagrams" aria-expanded="false" title="My diagrams">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2 4.2c0-.66.54-1.2 1.2-1.2h3.2l1.4 1.6h5c.66 0 1.2.54 1.2 1.2v6.2c0 .66-.54 1.2-1.2 1.2H3.2c-.66 0-1.2-.54-1.2-1.2V4.2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button class="rail-icon-btn" id="rail-menu-btn" aria-label="Menu" aria-expanded="false" title="Menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M2 4.5H16M2 9H16M2 13.5H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="rail-icon-spacer"></div>

    <button class="rail-icon-btn" id="script-toggle-btn" aria-label="Toggle script editor" title="Toggle script editor">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5V13.5" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </aside>

  <aside class="side-panel" id="side-panel" aria-hidden="true">
    <div class="panel-head">
      <span class="title" id="panel-title">My diagrams</span>
      <button class="panel-close" id="panel-close" aria-label="Close panel">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="panel-view active" id="panel-files">
        <div class="panel-section" style="display:flex;align-items:center;justify-content:space-between;">
          <span>Saved diagrams</span>
          <button class="tree-action-btn" id="dr-new-folder" title="New folder">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2 4.2c0-.66.54-1.2 1.2-1.2h3.2l1.4 1.6h5c.66 0 1.2.54 1.2 1.2v6.2c0 .66-.54 1.2-1.2 1.2H3.2c-.66 0-1.2-.54-1.2-1.2V4.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 7.6H10M8 5.6V9.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="current-file-bar" id="current-file-bar" style="display:none;">
          <span class="cf-name" id="current-file-name"></span>
          <span class="cf-saved">Saved</span>
        </div>
        <div class="drawings-tree" id="drawings-tree"></div>
      </div>

      <div class="panel-view" id="panel-menu">
        <div class="panel-section">File</div>
        <button class="panel-item" id="menu-new">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 1.5h6l4 4V14.5H3V1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 1.5V5.5H13" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          New diagram
        </button>
        <button class="panel-item" id="menu-example">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 13V3.5C2 2.7 2.7 2 3.5 2H9l4.5 4.5V13c0 .8-.7 1.5-1.5 1.5h-8.5C2.7 14.5 2 13.8 2 13z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          Load example
        </button>
        <button class="panel-item" id="menu-reset-layout">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13.5 2.5V6H10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Reset layout
        </button>

        <div class="panel-divider"></div>
        <div class="panel-section">View</div>
        <button class="panel-item" id="menu-toggle2">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 10.5H14.5" stroke="currentColor" stroke-width="1.3"/></svg>
          <span id="menu-toggle2-label">Bottom boxes</span>
        </button>

        <div class="panel-divider"></div>
        <div class="panel-section">Export</div>
        <button class="panel-item" id="menu-svg">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 1.5V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11.5V13c0 .55.45 1 1 1h10c.55 0 1-.45 1-1v-1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Download SVG
        </button>
        <button class="panel-item" id="menu-png">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 1.5V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11.5V13c0 .55.45 1 1 1h10c.55 0 1-.45 1-1v-1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Download PNG
        </button>

        <div class="panel-divider"></div>
        <div class="panel-section">Danger zone</div>
        <button class="panel-item panel-item-danger" id="menu-clear">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4.5 4.5V13a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Clear script
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="editor-pane">
      <div class="editor-label"><span>Script</span><span class="count" id="linecount">0 lines</span></div>
      <textarea id="dsl" spellcheck="false"></textarea>
      <div class="error-bar" id="errbar"></div>
      <div class="help hidden-control" id="help"></div>
      <div class="editor-resize-handle" id="editor-resize-handle" title="Drag to resize"></div>
    </div>

    <div class="canvas-pane">
      <div class="canvas-scroll">
        <div id="diagram-holder"></div>
      </div>
      <div class="link-hint" id="link-hint">Drag to a target and release to connect — Esc to cancel</div>
      <div class="history-controls">
        <button class="icon-toggle-btn" id="undo-btn" aria-label="Undo" title="Undo (Ctrl/Cmd+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 9.3L2.7 6L6 2.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.7 6H9.7C11.7 6 13.3 7.6 13.3 9.7C13.3 11.7 11.7 13.3 9.7 13.3H7.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-toggle-btn" id="redo-btn" aria-label="Redo" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 9.3L13.3 6L10 2.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.3 6H6.3C4.3 6 2.7 7.6 2.7 9.7C2.7 11.7 4.3 13.3 6.3 13.3H8.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <aside class="side-panel right" id="side-panel-right" aria-hidden="true">
    <div class="panel-head">
      <span class="title" id="panel-right-title">Diagram style</span>
      <button class="panel-close" id="panel-right-close" aria-label="Close panel">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="panel-body" id="panel-right-body"></div>
  </aside>

  <aside class="app-rail" id="app-rail-right" aria-label="Style rail">
    <button class="rail-icon-btn" id="rail-style-btn" aria-label="Style panel" aria-expanded="false" title="Style panel">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
        <path d="M2 4h6M11 4h3M2 8h3M8 8h6M2 12h9M14 12h0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="8.5" cy="4" r="1.7" fill="var(--panel-raised)" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="5.5" cy="8" r="1.7" fill="var(--panel-raised)" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="11.5" cy="12" r="1.7" fill="var(--panel-raised)" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </button>
  </aside>
  </div>

</div>

<div class="modal-overlay" id="new-diagram-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ndm-title">
    <div class="modal-head">
      <span class="modal-title" id="ndm-title">New diagram</span>
      <button class="panel-close" id="ndm-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="modal-field-label">Name</div>
        <input type="text" id="ndm-name" class="modal-input" placeholder="Untitled diagram" autocomplete="off">
      </div>

      <div>
        <div class="modal-field-label">Diagram type</div>
        <!-- Populated at runtime by js/core/new-diagram-modal.js from the
             ENGINES registry (see js/core/state.js) -- one card per
             registered engine, using that engine's own `thumbnail` + `label`.
             Nothing here needs to change when a new drawing-style engine
             is added; see js/engines/sequence.js for the contract. -->
        <div class="type-card-group" id="ndm-type-group"></div>
      </div>

      <div>
        <div class="modal-field-label">Start with</div>
        <div class="type-tabs" id="ndm-content-group">
          <button type="button" class="type-tab" data-content="sample">Sample</button>
          <button type="button" class="type-tab" data-content="blank">Blank</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="abtn ghost" id="ndm-cancel">Cancel</button>
      <button class="abtn primary" id="ndm-create">Create diagram</button>
    </div>
  </div>
</div>

<script src="js/core/state.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/interactions.js"></script>
<!-- Each drawing style is a self-contained engine file; add new ones here -->
<script src="js/engines/sequence.js"></script>
<script src="js/engines/swimlane.js"></script>
<!-- Sankey is the one engine that reaches for an external library (see the
     header comment in js/engines/sankey.js for why) -- these two <script>
     tags must load before it, in this order. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
<script src="js/engines/sankey.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/history.js"></script>
<script src="js/core/chrome.js"></script>
<script src="js/core/properties-panel.js"></script>
<script src="js/core/new-diagram-modal.js"></script>
<script src="js/core/persistence.js"></script>
</body>
</html>
